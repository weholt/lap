[package]
name = "lap-raw-platform"
version = "0.1.0"
edition = "2024"
description = "Platform qualification and performance harness for the Lap raw-development extraction (lap-c0e / TASK-601). Measures cold decode, warm slider p95, settled preview, export, RAM/VRAM and thumbnail throughput under indexing load on the real GPU backend, and executes the spec-A7 GPU failure-mode checks."
publish = false

[dependencies]
# The real application library under qualification (develop service, recipe
# repository, export pipeline).
lap_lib = { package = "Lap", path = "../../../src-tauri" }
# Same pinned engine revision the application consumes
# (docs/raw-development/engine-lock.json consumption.cargoDependency).
rapidraw-edit-model = { git = "file:///C:/Users/Thomas/Desktop/RapidRAW-engine", rev = "de4fdbd76723c76145b477a2b8874226512475f1" }
rapidraw-develop = { git = "file:///C:/Users/Thomas/Desktop/RapidRAW-engine", rev = "de4fdbd76723c76145b477a2b8874226512475f1" }
# Matching versions from the application graph so the unified build resolves
# one shared compile of each.
rusqlite = { version = "0.32.1", features = ["bundled"] }
image = "0.25.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# RAM (GlobalMemoryStatusEx / GetProcessMemoryInfo) counters. VRAM uses raw
# COM against dxgi.lib (windows-sys does not ship the COM-heavy DXGI
# surface), declared locally in src/counters.rs.
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.dev.package."*"]
# Matches the application's dev profile so debug-built workloads still run
# full-resolution RAW decode/render at representative speed.
opt-level = 3

# The application library itself at the same opt-level its unit tests use
# (mirrors the e2e harness profile).
[profile.dev.package.Lap]
opt-level = 0
