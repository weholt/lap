[package]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
name = "Lap"
version = "0.3.2"
description = "An offline-first photo manager for large local libraries."
homepage = "https://julyx10.github.io/lap"
repository = "https://github.com/julyx10/lap"
authors = ["julyx10 <tiangle@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "lap_lib"
path = "src/lib.rs"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[dependencies]
# Engine consumption is pinned to an exact revision of the isolated local
# engine clone (never a floating branch, never an uncommitted path) per
# docs/raw-development/engine-lock.json (`consumption.cargoDependency`,
# TASK-205/lap-517, consumed by lap-a52/TASK-302). Cargo records the exact
# rev in Cargo.lock; reproduce locally per that lock's `localReproduction`
# steps. This task also validates `cargo_lock_pins_engine_revision`.
rapidraw-edit-model = { git = "file:///C:/Users/Thomas/Desktop/RapidRAW-engine", rev = "e43646df6e75aabc771bac72458c51e5aef7734a" }
rapidraw-develop = { git = "file:///C:/Users/Thomas/Desktop/RapidRAW-engine", rev = "e43646df6e75aabc771bac72458c51e5aef7734a" }
tauri = { version = "2", features = [
    "macos-private-api",
    "protocol-asset",
] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.3.2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-aptabase = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["bundled", "collation"] }
chrono = "0.4"
rstar = "0.12"
csv = "1"
dirs = "5.0.1"
walkdir = "2.5.0"
# Hard-link alias detection for develop export source protection (std's
# windows_by_handle metadata APIs are still unstable); already in the graph
# via walkdir.
same-file = "1.0.6"
trash = "3.3.1"
base64 = "0.22.1"
flate2 = "1"
http = "1"
image = "0.25.10"
png = "0.18.1"
kamadak-exif = "0.6.1"
little_exif = "0.6.23"
fast_image_resize = "5.1.0"
imagesize = "0.13.0"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
opener = "0.7.2"
arboard = "3.6.1"
pinyin = "0.10.0"
once_cell = "1.21.4"
rand = "0.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
] }
ndarray = "0.16"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1.8.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
jxl-oxide = { version = "0.12.5", features = ["image"] }
libc = "0.2"
hnsw_rs = "0.3.4"

[dev-dependencies]
# Test-only: names `wgpu::Backends::empty()` for the deterministic
# unsupported-device regression. Same major version the pinned engine uses;
# never enabled in release builds.
wgpu = { version = "29", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
percent-encoding = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDictionary", "NSError", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
# Unified on 0.62 with the engine's wgpu-hal stack: gpu-allocator 0.28 accepts
# windows >=0.53,<=0.62 and must resolve to the SAME version wgpu-hal uses, or
# its D3D12 allocator types no longer match (lap-a52 build integration).
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
